<section class="relative w-full h-70 md:h-85 overflow-hidden">
    <div class="absolute inset-0 bg-linear-to-r from-[#050f3a] via-[#0f172a] to-[#195a86]"></div>
    <div class="absolute -left-32 -top-24 w-125 h-125
           bg-linear-to-br from-[#27aae1]/40 to-[#1e40af]/40
           rounded-full blur-2xl">
    </div>
    <div class="absolute right-45 top-30 w-130 h-130
           bg-linear-to-br from-[#1e40af]/30 to-[#020617]/40
           rounded-full blur-3xl">
    </div>
    <div class="relative z-10 h-full flex flex-col items-center justify-center text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white">
            Contact Us
        </h1>
        <p class="mt-3 text-sm md:text-base text-gray-300">
            <a routerLink="/" class="breadcrumb-link">
                Home
            </a>

            <span class="mx-2 text-[#27aae1]">•</span>

            <span class="text-white font-medium">
                About Us
            </span>
        </p>

</section>

<section class="py-16 bg-gray-100">
    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 px-6">

        <!-- Contact Details -->
        <div>
            <h2 class="text-4xl font-extrabold text-[#000000]">Contact Us</h2>

            <div class="space-y-6 text-gray-700 mt-8">
                <div>
                    <h4 class="text-[#3B82F6] font-semibold mt-14">Call</h4>
                    <p>(021) 37121517</p>
                </div>

                <div>
                    <h4 class="text-[#3B82F6] font-semibold">Email</h4>
                    <p>info@itpanda.org</p>
                </div>

                <div>
                    <h4 class="text-[#3B82F6] font-semibold">Address</h4>
                    <p>Gulshan Town, Karachi, Pakistan</p>
                </div>

            </div>
        </div>
        <!-- form -->
        <div class="bg-white p-8 rounded-xl shadow-lg">
            <h3 class="text-2xl font-bold text-[#000000] mb-4">Drop Us a Message</h3>
            <p class="text-gray-600 mb-6">If you have any query, send us a message.</p>

            <form class="space-y-4">
                <input type="text" placeholder="Your Name"
                    class="mb-3 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B82F6]" />
                <input type="email" placeholder="Email"
                    class="mb-3 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B82F6]" />
                <input type="text" placeholder="Phone"
                    class="mb-3 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B82F6]" />
                <input type="text" placeholder="Website"
                    class="mb-3 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B82F6]" />
                <textarea placeholder="Message" rows="4"
                    class="mb-3 w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#3B82F6]"></textarea>

                <button type="submit"
                    class="btn w-full bg-linear-to-r from-[#000000] to-[#3B82F6] text-white font-semibold py-3 rounded-lg hover:opacity-90 transition">
                    SEND MESSAGE
                </button>
            </form>
        </div>

    </div>
</section>
