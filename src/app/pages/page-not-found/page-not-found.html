<section class="relative min-h-screen flex items-center justify-center overflow-hidden
         bg-linear-to-br from-black via-[#020617] to-black">

    <!-- Stars -->
    <div class="absolute inset-0 bg-[radial-gradient(circle,rgba(41,171,226,0.25)_1px,transparent_1px)]
              bg-size-[22px_22px] opacity-50"></div>

    <!-- Content -->
    <div class="relative z-10 text-center px-6">

        <!-- 404 with Planet -->
        <div class="flex items-center justify-center gap-6">

            <span class="text-[20rem] font-extrabold text-white">4</span>

            <!-- Planet -->
            <div class="relative w-40 h-40 rounded-full
                  bg-linear-to-br from-[#29ABE2] to-[#0ea5e9] planet-float">

                <!-- Planet ring -->
                <div class="absolute inset-0 rounded-full border-4 border-[#7dd3fc]
                 rotate-[-25deg] scale-x-150"></div>

                <!-- Planet highlights -->
                <div class="absolute top-6 left-8 w-10 h-4 bg-white/30 rounded-full"></div>
                <div class="absolute bottom-8 right-6 w-12 h-5 bg-white/20 rounded-full"></div>
            </div>

            <span class="text-[20rem] font-extrabold text-white">4</span>
        </div>

        <!-- Text -->
        <h2 class="mt-6 text-2xl font-bold text-white">
            Oops! We Can't Find That Page
        </h2>

        <p class="mt-2 text-gray-300 max-w-md mx-auto fw-bold text-left">
            The page you're looking for seems to have taken a different path. It may have been relocated,
            removed, or perhaps it was never there to begin with.
        </p>

        <!-- Button -->
        <div class="mt-8">
            <a routerLink="/" class="inline-block px-8 py-3 rounded-md
               bg-[#29ABE2] font-semibold button
               hover:bg-[#0ea5e9] transition">
                TAKE ME HOME
            </a>
        </div>

    </div>
</section>
