<section class="overflow-x-hidden">
  <div
    class="flex flex-col md:flex-row
           bg-gray-100 p-4 md:p-8
           gap-6 md:gap-12">

    <!-- Form Section -->
    <div class="w-full md:w-2/3 bg-white p-6 md:p-8 rounded-xl shadow-lg">
      <h2 class="text-2xl md:text-3xl font-semibold text-black mb-4">
        Write To Us!
      </h2>

      <form class="space-y-4">

        <!-- First + Last Name -->
        <div class="flex flex-col md:flex-row gap-4">
          <div class="w-full md:w-1/2">
            <label class="text-lg font-medium text-black">First Name</label>
            <input
              type="text"
              class="w-full p-3 mt-1 rounded-md border border-gray-300"
              placeholder="First Name">
          </div>

          <div class="w-full md:w-1/2">
            <label class="text-lg font-medium text-black">Last Name</label>
            <input
              type="text"
              class="w-full p-3 mt-1 rounded-md border border-gray-300"
              placeholder="Last Name">
          </div>
        </div>

        <div>
          <label class="text-lg font-medium text-black">Email</label>
          <input
            type="email"
            class="w-full p-3 mt-1 rounded-md border border-gray-300"
            placeholder="Email">
        </div>

        <div>
          <label class="text-lg font-medium text-black">Phone</label>
          <input
            type="tel"
            class="w-full p-3 mt-1 rounded-md border border-gray-300"
            placeholder="Phone">
        </div>

        <div>
          <label class="text-lg font-medium text-black">Message</label>
          <textarea
            rows="4"
            class="w-full p-3 mt-1 rounded-md border border-gray-300"
            placeholder="Message"></textarea>
        </div>

        <button
          type="submit"
          class="btn w-full md:w-60
                 bg-[#3B82F6] text-white
                 py-3 rounded-lg
                 hover:bg-blue-700 transition">
          SEND MESSAGE
        </button>

      </form>
    </div>

    <!-- Contact Info Section -->
    <div class="w-full md:w-1/3 bg-[#044d6d] p-6 md:p-8 rounded-xl shadow-lg text-white">
      <h2 class="text-2xl md:text-3xl font-semibold mb-4">
        Contact Info
      </h2>

      <div class="space-y-6">

        <div class="flex items-center gap-4">
          <i class="fas fa-phone-alt text-2xl md:text-4xl"></i>
          <div>
            <h3 class="font-semibold">Phone</h3>
            <p>(021) 37121517</p>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <i class="fas fa-envelope text-2xl md:text-4xl"></i>
          <div>
            <h3 class="font-semibold">Email</h3>
            <p>info@itpanda.org</p>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <i class="fas fa-map-marker-alt text-2xl md:text-4xl"></i>
          <div>
            <h3 class="font-semibold">Address</h3>
            <p>Karachi, Pakistan</p>
          </div>
        </div>

        <div>
          <h3 class="font-semibold mb-3">Follow Us</h3>
          <div class="flex gap-4">
            <i class="fab fa-facebook text-2xl md:text-4xl"></i>
            <i class="fab fa-instagram text-2xl md:text-4xl"></i>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
