<!-- src/app/faq/faq-page.component.html -->
<section class="bg-linear-to-r from-[#f0f9ff] via-[#e0f2fe] to-white py-20">
  <div class="container mx-auto px-6 max-w-4xl">
    <h1 class="text-3xl font-extrabold text-[#061b33] mb-10">Frequently Asked Questions</h1>

    <div class="divide-y divide-gray-200">
      <div *ngFor="let item of faqs" class="py-6">
        <details class="group">
          <summary class="flex justify-between items-center cursor-pointer">
            <span class="font-semibold text-[#061b33]">{{item.question}}</span>
          </summary>
          <p class="mt-3 text-gray-700">{{item.answer}}</p>
        </details>
      </div>
    </div>
  </div>
</section>

 <app-topbutton></app-topbutton>
