<section class="bg-white py-16">
  <div class="max-w-4xl mx-auto text-center px-6">
    
    <h2 class="text-3xl md:text-4xl font-bold text-black mb-6">
      What Our Clients Say
    </h2>

      <div class="flex justify-center mb-6">
      <i class="fa-solid fa-quote-right text-blue-400 text-5xl"></i>
    </div>

    <p class="text-gray-600 italic text-lg min-h-30 transition-all duration-500">
      {{ testimonials[currentIndex].text }}
    </p>

    <h4 class="mt-6 font-bold text-black">
      {{ testimonials[currentIndex].name }}
    </h4>

    <div class="flex justify-center gap-3 mt-10">
      <span
        *ngFor="let t of testimonials; let i = index"
        (click)="goToSlide(i)"
        class="h-3 w-3 rounded-full cursor-pointer transition-all duration-300"
        [ngClass]="i === currentIndex ? 'bg-indigo-900 w-6' : 'bg-indigo-300'">
      </span>
    </div>

  </div>
</section>
